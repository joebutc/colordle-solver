[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "colordle_solver_joebutc"
version = "0.0.1"
authors = [
    { name="Joseph Butcher", email="joebutch06@gmail.com" },
]
description = "An algorithm that solves the daily colordle"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/joebutc/colordle_solver"
Issues = "https://github.com/joebutc/colordle_solver/issues"
